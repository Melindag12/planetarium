<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>JUPITER</title>

  <link rel="stylesheet" href="jupiter.css">
</head>

<body>

<div class="container">

  <div class="left">
    <div class="planet"></div>
  </div>

  <div class="right">

    <div class="line"></div>

    <h1>JUPITER</h1>

    <p class="description">
      Jupiter ist der größte Planet unseres Sonnensystems
      und ein Gasriese, der hauptsächlich aus Wasserstoff und Helium besteht.
    </p>

    <div class="facts">

      <div class="fact">
        <span class="fact-title">Durchmesser</span>
        <span>139.820 km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Entfernung zur Sonne</span>
        <span>778 Mio. km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Umlaufzeit</span>
        <span>11,86 Jahre</span>
      </div>

      <div class="fact">
        <span class="fact-title">Temperatur</span>
        <span>-108°C (Wolkenobergrenze)</span>
      </div>

      <div class="fact">
        <span class="fact-title">Monde</span>
        <span>95+</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
