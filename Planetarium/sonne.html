<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>SONNE</title>

  <link rel="stylesheet" href="sonne.css">
</head>

<body>

<div class="container">

  <div class="left">
    <div class="planet"></div>
  </div>

  <div class="right">

    <div class="line"></div>

    <h1>SONNE</h1>

    <p class="description">
      Die Sonne ist der Stern im Zentrum unseres Sonnensystems
      und die wichtigste Energiequelle für das Leben auf der Erde.
    </p>

    <div class="facts">

      <div class="fact">
        <span class="fact-title">Durchmesser</span>
        <span>1.392.700 km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Temperatur Oberfläche</span>
        <span>ca. 5.500 °C</span>
      </div>

      <div class="fact">
        <span class="fact-title">Temperatur Kern</span>
        <span>ca. 15 Mio. °C</span>
      </div>

      <div class="fact">
        <span class="fact-title">Alter</span>
        <span>ca. 4,6 Mrd. Jahre</span>
      </div>

      <div class="fact">
        <span class="fact-title">Typ</span>
        <span>G-Stern (Gelber Zwerg)</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
