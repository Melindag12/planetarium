<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEPTUN</title>

  <link rel="stylesheet" href="neptun.css">
</head>
<script>
  setTimeout(function () {
    window.location.href = "weiterreise.html";
  }, 20000);
</script>
<body>

<div class="container">

  <div class="left">
    <div class="planet"></div>
  </div>

  <div class="right">

    <div class="line"></div>

    <h1>NEPTUN</h1>

    <p class="description">
      Neptun ist der äußerste Planet unseres Sonnensystems
      und ein kalter Eisriese mit starken Stürmen.
    </p>

    <div class="facts">

      <div class="fact">
        <span class="fact-title">Durchmesser</span>
        <span>49.244 km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Entfernung zur Sonne</span>
        <span>4,5 Mrd. km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Umlaufzeit</span>
        <span>165 Jahre</span>
      </div>

      <div class="fact">
        <span class="fact-title">Temperatur</span>
        <span>-214°C</span>
      </div>

      <div class="fact">
        <span class="fact-title">Monde</span>
        <span>14</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
