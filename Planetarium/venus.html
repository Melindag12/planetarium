<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VENUS</title>

  <link rel="stylesheet" href="venus.css">
</head>
<script>
  setTimeout(function () {
    window.location.href = "weiterreise.html";
  }, 20000);
</script>
<body>

<div class="container">

  <div class="left">
    <div class="planet"></div>
  </div>

  <div class="right">

    <div class="line"></div>

    <h1>VENUS</h1>

    <p class="description">
      Die Venus ist der zweite Planet von der Sonne
      und der heißeste Planet im Sonnensystem.
      Sie wird oft als „Schwester der Erde“ bezeichnet.
    </p>

    <div class="facts">

      <div class="fact">
        <span class="fact-title">Durchmesser</span>
        <span>12.104 km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Entfernung zur Sonne</span>
        <span>108,2 Mio. km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Umlaufzeit</span>
        <span>225 Tage</span>
      </div>

      <div class="fact">
        <span class="fact-title">Atmosphäre</span>
        <span>CO₂-dicht, sehr heiß (über 460°C)</span>
      </div>

      <div class="fact">
        <span class="fact-title">Monde</span>
        <span>0</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
