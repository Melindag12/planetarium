<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>MERKUR</title>

  <link rel="stylesheet" href="merkur.css">
</head>

<body>

<div class="container">

  <div class="left">
    <div class="planet"></div>
  </div>

  <div class="right">

    <div class="line"></div>

    <h1>MERKUR</h1>

    <p class="description">
      Merkur ist der sonnennächste Planet unseres Sonnensystems
      und der kleinste der acht Planeten.
    </p>

    <div class="facts">

      <div class="fact">
        <span class="fact-title">Durchmesser</span>
        <span>4.879 km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Entfernung zur Sonne</span>
        <span>57,9 Mio. km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Umlaufzeit</span>
        <span>88 Tage</span>
      </div>

      <div class="fact">
        <span class="fact-title">Temperatur</span>
        <span>-180°C bis 430°C</span>
      </div>

      <div class="fact">
        <span class="fact-title">Monde</span>
        <span>0</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
