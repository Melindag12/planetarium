<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>URANUS</title>

  <link rel="stylesheet" href="uranus.css">
</head>

<body>

<div class="container">

  <div class="left">
    <div class="planet"></div>
  </div>

  <div class="right">

    <div class="line"></div>

    <h1>URANUS</h1>

    <p class="description">
      Uranus ist ein Eisriese im äußeren Sonnensystem
      und zeichnet sich durch seine extreme Achsneigung aus.
    </p>

    <div class="facts">

      <div class="fact">
        <span class="fact-title">Durchmesser</span>
        <span>50.724 km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Entfernung zur Sonne</span>
        <span>2,87 Mrd. km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Umlaufzeit</span>
        <span>84 Jahre</span>
      </div>

      <div class="fact">
        <span class="fact-title">Temperatur</span>
        <span>-224°C</span>
      </div>

      <div class="fact">
        <span class="fact-title">Monde</span>
        <span>27+</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
