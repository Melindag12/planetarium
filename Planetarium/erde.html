<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERDE</title>

  <link rel="stylesheet" href="erde.css">
</head>

<body>

<div class="container">

  <div class="left">
    <div class="planet"></div>
  </div>

  <div class="right">


    <div class="line"></div>

    <h1>ERDE</h1>

    <p class="description">
      Die Erde ist der dritte Planet von der Sonne
      und der einzige bekannte Ort,
      an dem Leben existiert.
    </p>

    <div class="facts">

      <div class="fact">
        <span class="fact-title">Durchmesser</span>
        <span>12.742 km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Entfernung zur Sonne</span>
        <span>149,6 Mio. km</span>
      </div>

      <div class="fact">
        <span class="fact-title">Umlaufzeit</span>
        <span>365 Tage</span>
      </div>
       </div>
       
      <div class="fact">
        <span class="fact-title">Wasser</span>
        <span>1,4 Milliarden Kubikkilometer</span>
      </div>

      <div class="fact">
        <span class="fact-title">Monde</span>
        <span>1</span>
     

    </div>


  </div>

</div>

</body>
</html>
